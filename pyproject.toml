[project]
name = "medicare-qa"
version = "0.1.0"
description = "A RAG service that answers Medicare questions from the official \"Medicare & You 2026\" handbook, with cited page numbers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.19.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
