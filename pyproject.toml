[project]
name = "fineprint"
version = "0.1.0"
description = "A RAG service that answers Medicare questions from the official \"Medicare & You 2026\" handbook, with cited page numbers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a running Postgres; skips with a reason when DATABASE_URL is unreachable",
]
