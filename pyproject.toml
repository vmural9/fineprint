[project]
name = "fineprint"
version = "0.1.0"
description = "A RAG service that answers Medicare questions from the official \"Medicare & You 2026\" handbook, with cited page numbers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=1.7.0",
    "boto3>=1.43.98",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
fineprint = "fineprint.cli:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Both packages are ours. Naming them keeps import blocks sorted the same way whether or not a
# module exists yet, which matters for the modules that are imported inside a function.
known-first-party = ["fineprint", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests call AWS and cost money, so they are deselected unless asked for by name:
#   AWS_PROFILE=<your-aws-profile> AWS_REGION=us-west-2 uv run pytest -m live
# A -m on the command line replaces the one below.
addopts = "-m 'not live'"
markers = [
    "integration: needs a running Postgres; skips with a reason when DATABASE_URL is unreachable",
    "live: really calls AWS Bedrock; deselected by default and skipped without credentials",
]
